<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta http-equiv="X-UA-Compatible" content="IE=edge">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <meta name="description" content="An interactive 3D dorm room portfolio experience.">
        <title>Dorm Room 3D</title>
        <style>
            html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; }
            canvas { display: block; width: 100%; height: 100%; }
            nav {
                position: fixed;
                top: 0;
                left: 0;
                width: 100%;
                padding: 10px 10%;
                display: flex;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
                box-sizing: border-box;
                background: rgba(231, 238, 245, 0.851);
                backdrop-filter: blur(10px);
                z-index: 1000;
            }
            .logo {
                width: 155px;
                display: block;
            }
            nav ul { margin: 0; padding: 0; }
            nav ul li { display: inline-block; list-style: none; margin: 5px 20px; }
            nav ul li a {
                color: #282f5de4;
                font-family: 'Century Gothic', sans-serif;
                font-size: 18px;
                font-weight: 300;
                position: relative;
                text-decoration: none;
            }
            nav ul li a::after {
                content: '';
                width: 0;
                height: 3px;
                background: #3d82c2;
                position: absolute;
                left: 0;
                bottom: -6px;
                transition: width 0.5s;
            }
            nav ul li a:hover::after,
            nav ul li a:focus-visible::after { width: 100%; }
            @media (max-width: 600px) {
                nav { padding: 10px 5%; }
                nav ul li { margin: 5px 8px; }
                nav ul li a { font-size: 14px; }
            }
            .bio-link:link { color: rgb(182, 106, 0); font-weight: 600; transition: color 0.2s ease-in-out;}
        </style>
    </head>
    <body>
        <div class="unsticky-nav">
            <nav aria-label="Main navigation">
                <a href="https://dhamar-cs15.github.io/index.html" aria-label="Home">
                    <img src="https://dhamar-cs15.github.io/images/name_logo.png" alt="logo" class="logo">
                </a>
                <ul>
                    <li><a href="https://dhamar-cs15.github.io/index.html">Home</a></li>
                    <li><a href="https://dhamar-cs15.github.io/about.html">About</a></li>
                    <li><a href="https://dhamar-cs15.github.io/projects.html">Projects</a></li>
                    <li><a href="https://dhamar-cs15.github.io/art.html">Art</a></li>
                </ul>
            </nav>
        </div>
        
        <script src="./js/script.js" type="module"></script>
    </body>
</html>
